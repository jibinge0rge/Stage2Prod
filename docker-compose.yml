services:
  # No bundled Postgres here — this file expects DATABASE_URL (in .env) to
  # point at a database you already run (managed/cloud or self-hosted). For
  # local dev with a bundled Postgres, see docker-compose.dev.yml.
  stage2prod:
    build: .
    image: stage2prod:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
